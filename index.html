<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1622">
<title>Atlas</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21"/><path d="M15.8 8.2l-2.1 5.5-5.5 2.1 2.1-5.5z"/><circle class="nd" cx="12" cy="12" r="1.3"/></svg></span>
      <div>
        <b>Atlas</b>
        <small id="roleNote">Кабинет продавца</small>
      </div>
    </div>
    <div class="roles" id="roles" role="tablist" aria-label="Чьими глазами смотреть"></div>
    <nav id="nav" class="nav" aria-label="Разделы"></nav>
    <div class="rail-foot">
      <p class="demo-note">Демо-версия: данные вымышленные, деньги не настоящие.</p>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Сменить тему"></button>
    </div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>

<button class="sim-btn" id="simBtn" type="button" aria-controls="sim" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 006 21h12a1.7 1.7 0 001.5-2.5L14 9V3"/><path d="M7 15h10"/></svg><span>Тест</span></button>
<aside class="sim" id="sim" hidden aria-label="Тестовая панель">
  <div class="sim-head"><b>Тестовая панель</b><button class="sim-close" type="button" data-sim="close" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p class="sim-note">Имитирует внешние сервисы, чтобы проверить сбои. В рабочей системе этой панели нет.</p>
  <div class="sim-body"></div>
</aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="js/core.js"></script>
<script src="js/seller.js"></script>
<script src="js/buyer.js"></script>
<script src="js/platform.js"></script>
<script src="js/main.js"></script>
</body>
</html>
