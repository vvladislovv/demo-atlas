<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Pay</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21"/><path d="M15.8 8.2l-2.1 5.5-5.5 2.1 2.1-5.5z"/><circle class="nd" cx="12" cy="12" r="1.3"/></svg></span>
      <div>
        <b>Atlas Pay</b>
        <small>Платежи и выплаты</small>
      </div>
    </div>
    <nav id="nav" class="nav" aria-label="Экраны стенда"></nav>
    <div class="rail-foot">
      <p class="demo-note">Тестовая среда. Данные вымышленные.</p>
      <button class="rail-link" id="resetBtn" type="button">Сбросить тестовые данные</button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Сменить тему"></button>
    </div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
